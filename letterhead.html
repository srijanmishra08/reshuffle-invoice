<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letterhead – Reshuffle OPC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #f0f0f0;
      color: #111;
    }

    /* ── Controls (hidden on print) ── */
    #controls {
      background: #1a1a1a;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    #controls button {
      background: #fff;
      color: #1a1a1a;
      border: none;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    #controls button:hover { background: #ddd; }
    #controls a { color: #ccc; font-size: 12px; text-decoration: none; margin-left: 4px; }
    #controls a:hover { color: #fff; }

    /* ── Page ── */
    #page {
      width: 794px;
      min-height: 1123px;
      background: #fff;
      margin: 24px auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
    }
    @page { size: A4; margin: 0; }

    /* ── Letterhead header (reusable) ── */
    .lh-wordmark {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 30px 40px 24px;
    }
    /* logo asset is white-on-black — use as-is on black header */
    .lh-wordmark img {
      width: 100%;
      height: auto;
    }
    .lh-contact {
      background: #000;
      color: #fff;
      display: flex;
      justify-content: space-between;
      padding: 12px 40px;
      font-size: 12px;
      line-height: 1.7;
    }
    .lh-contact .right { text-align: right; }

    /* ── Body ── */
    .lh-body {
      flex: 1;
      padding: 44px 56px;
    }
    .lh-body textarea {
      width: 100%;
      height: 100%;
      min-height: 640px;
      border: 1px dashed #ddd;
      border-radius: 4px;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
      color: #222;
      padding: 16px;
      resize: vertical;
      outline: none;
      background: #fafafa;
    }

    /* ── Footer signature ── */
    .lh-foot {
      padding: 0 56px 48px;
      display: flex;
      justify-content: flex-end;
    }
    .lh-foot .sig { text-align: right; font-size: 14px; }
    .lh-foot img { height: 56px; width: auto; mix-blend-mode: multiply; display: block; margin-left: auto; }

    @media print {
      html, body { background: #fff; }
      #controls { display: none; }
      #page { margin: 0; box-shadow: none; width: 100%; min-height: auto; }
      .lh-body textarea {
        border: none !important; background: #fff !important; min-height: auto;
        height: auto; padding: 0;
      }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<div id="controls">
  <strong style="font-size:15px;letter-spacing:1px;">RESHUFFLE LETTERHEAD</strong>
  <button onclick="savePDF()">Save PDF</button>
  <a href="invoice-generator.html">Invoice →</a>
  <a href="work-order.html">Work Order →</a>
  <a href="salary-slip.html">Salary Slip →</a>
  <a href="offer-letter.html">Offer Letter →</a>
</div>

<div id="page">

  <!-- ── Reusable letterhead header ── -->
  <div class="lh-wordmark">
    <img src="logo-trim.png" alt="Reshuffle" />
  </div>
  <div class="lh-contact">
    <div>
      GSTIN- 22AAPCR2685E1Z9<br />
      +91 7879722663
    </div>
    <div class="right">
      reshufflebusiness@gmail.com<br />
      www.reshxffle.com
    </div>
  </div>

  <!-- ── Editable body ── -->
  <div class="lh-body">
    <textarea placeholder="Type your letter here…">Date: </textarea>
  </div>

  <!-- ── Signature ── -->
  <div class="lh-foot">
    <div class="sig">
      <img src="IMG_4492.PNG" alt="Signature" />
      Srijan Mishra<br />
      Reshuffle OPC Private Limited
    </div>
  </div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
<script>
  function savePDF() {
    var el = document.getElementById('page');
    var opt = {
      margin: 0,
      filename: 'reshuffle-letterhead.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2, useCORS: true, backgroundColor: null,
        windowWidth: el.scrollWidth,
        onclone: function (doc) {
          doc.querySelectorAll('input, textarea').forEach(function (i) {
            i.style.border = 'none';
            i.style.borderBottom = 'none';
            i.style.background = 'transparent';
          });
          doc.querySelectorAll('.add-row-btn, .remove-row-btn, .remove-cell, .no-print').forEach(function (e) {
            e.style.display = 'none';
          });
        }
      },
      jsPDF: { unit: 'px', format: [el.offsetWidth, el.offsetHeight], orientation: 'portrait', hotfixes: ['px_scaling'] }
    };
    html2pdf().set(opt).from(el).save();
  }
</script>
</body>
</html>
